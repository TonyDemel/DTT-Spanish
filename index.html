<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTT Español Irlanda</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header>
            <button id="btn-home" class="hidden">🏠 Inicio</button>
            <div id="quiz-status" class="hidden">
                <span id="timer" class="hidden">45:00</span>
                <span id="progress-text"></span>
            </div>
        </header>

        <section id="view-home">
            <h1>DTT Español Irlanda</h1>
            <div class="menu-container">
                <button class="main-menu-btn" onclick="toggleSubmenu('read-menu')">Leer las preguntas ▾</button>
                <div id="read-menu" class="submenu hidden">
                    <button class="sub-btn" onclick="startMode('read', 'all')">Todas</button>
                    <button class="sub-btn" onclick="startMode('read', 'Control of Vehicle')">Control del vehículo</button>
                    <button class="sub-btn" onclick="startMode('read', 'Legal Matters / Rules of the Road')">Asuntos Legales</button>
                    <button class="sub-btn" onclick="startMode('read', 'Managing Risk')">Gestión de Riesgos</button>
                    <button class="sub-btn" onclick="startMode('read', 'Safe and Socially Responsible Driving')">Conducción Segura</button>
                    <button class="sub-btn" onclick="startMode('read', 'Technical Matters')">Asuntos Técnicos</button>
                </div>

                <button class="main-menu-btn action-btn" onclick="startMode('smart')">Practica Smart</button>

                <button class="main-menu-btn" onclick="toggleSubmenu('practice-menu')">Practica por categoría ▾</button>
                <div id="practice-menu" class="submenu hidden">
                    <div class="cat-config">
                        <select id="select-category" onchange="updateMaxQuestions()">
                            <option value="Control of Vehicle">Control del vehículo</option>
                            <option value="Legal Matters / Rules of the Road">Asuntos Legales</option>
                            <option value="Managing Risk">Gestión de Riesgos</option>
                            <option value="Safe and Socially Responsible Driving">Conducción Segura</option>
                            <option value="Technical Matters">Asuntos Técnicos</option>
                        </select>
                        <div id="max-label">Preguntas disponibles: 0</div>
                        <input type="number" id="num-questions" min="1" value="1">
                        <button class="action-btn" onclick="initCategoryPractice()">Empezar Práctica</button>
                    </div>
                </div>

                <button class="main-menu-btn official-btn" onclick="startMode('official')">Estilo oficial de examen</button>
            </div>
        </section>

        <section id="view-quiz" class="hidden">
            <div class="card">
                <div id="image-container" class="hidden">
                    <img id="question-image" src="" alt="Pregunta">
                </div>
                <div class="texts">
                    <p id="q-en" class="text-en"></p>
                    <p id="q-es" class="text-es"></p>
                </div>
                <div id="feedback-msg"></div>
                <div id="options-container" class="options-grid"></div>
                <div class="nav-controls">
                    <button id="btn-prev" class="nav-btn hidden" onclick="changeQuestion(-1)">⬅ Anterior</button>
                    <button id="btn-next" class="nav-btn hidden" onclick="handleNext()">Siguiente ➡</button>
                </div>
            </div>
        </section>

        <section id="view-results" class="hidden">
            <div class="card">
                <h2 id="result-status"></h2>
                <h3 id="result-score"></h3>
                <div id="category-breakdown"></div>
                <button onclick="location.reload()" class="main-menu-btn">Volver al Inicio</button>
            </div>
        </section>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
